services:
  mysql:
    image: mysql:8.0
    container_name: serms_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: serms
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_USER: serms_user
    ports:
      - "3306:3306"
    volumes:
      - serms_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "serms_user",
          "-p${MYSQL_PASSWORD:-secret}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - serms_network

  redis:
    image: redis:alpine
    container_name: serms_redis_internal
    restart: unless-stopped
    networks:
      - serms_network

  php:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: serms_php
    restart: unless-stopped
    volumes:
      - ./apps/api:/var/www
      - serms_api_vendor:/var/www/vendor
      - serms_api_bootstrap_cache:/var/www/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - serms_network
      - shared-capstone-network
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=serms
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - CACHE_STORE=redis
      - SERMS_SERVICE_ROLE=api
      - JWT_PUBLIC_KEY_PATH=/var/www/storage/oauth-public.key
      - PRS_REIMBURSEMENT_API_KEY=${PRS_REIMBURSEMENT_API_KEY:-prs-serms-local-service-key}
      - PRS_REIMBURSEMENT_STATUS_API_URL=http://prs_api:8000/api/integrations/serms/reimbursement-status
      - PRS_REIMBURSEMENT_STATUS_API_KEY=${PRS_REIMBURSEMENT_STATUS_API_KEY:-serms-prs-local-service-key}
      - PRS_REIMBURSEMENT_STATUS_API_TIMEOUT=10
      - AI_SERVICE_URL=http://ocr_api:8010
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-ocr-callback-key-change-me}
      - AI_SERVICE_CALLBACK_BASE_URL=http://serms_api:8000
      - AI_SERVICE_TIMEOUT=10
      - CMS_CONTRACT_URL=${CMS_CONTRACT_URL:-http://contract-management:8000/api}
      - CMS_VENDOR_URL=${CMS_VENDOR_URL:-http://vendor-management:8000/api}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      - CMS_SERVICE_TIMEOUT=${CMS_SERVICE_TIMEOUT:-5}
      - TS_API_URL=${TS_API_URL:-}
      - TS_REIMBURSEMENT_STATUS_URL=${TS_REIMBURSEMENT_STATUS_URL:-}
      - TS_INTERNAL_SECRET=${TS_INTERNAL_SECRET:-}
      - TS_SERVICE_TIMEOUT=${TS_SERVICE_TIMEOUT:-10}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5002}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5002}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_SCHEME=${MAIL_SCHEME:-}
      - MAIL_HOST=${MAIL_HOST:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-no-reply@sbsi.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-SBSI SERMS}

  api:
    image: nginx:alpine
    container_name: serms_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/var/www
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - serms_network
      - shared-capstone-network

  api_queue:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: serms_api_queue
    restart: unless-stopped
    volumes:
      - ./apps/api:/var/www
      - serms_api_vendor:/var/www/vendor
      - serms_api_bootstrap_cache:/var/www/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - serms_network
      - shared-capstone-network
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=serms
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - CACHE_STORE=redis
      - SERMS_SERVICE_ROLE=worker
      - JWT_PUBLIC_KEY_PATH=/var/www/storage/oauth-public.key
      - PRS_REIMBURSEMENT_API_KEY=${PRS_REIMBURSEMENT_API_KEY:-prs-serms-local-service-key}
      - PRS_REIMBURSEMENT_STATUS_API_URL=http://prs_api:8000/api/integrations/serms/reimbursement-status
      - PRS_REIMBURSEMENT_STATUS_API_KEY=${PRS_REIMBURSEMENT_STATUS_API_KEY:-serms-prs-local-service-key}
      - PRS_REIMBURSEMENT_STATUS_API_TIMEOUT=10
      - AI_SERVICE_URL=http://ocr_api:8010
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-ocr-callback-key-change-me}
      - AI_SERVICE_CALLBACK_BASE_URL=http://serms_api:8000
      - AI_SERVICE_TIMEOUT=10
      - CMS_CONTRACT_URL=${CMS_CONTRACT_URL:-http://contract-management:8000/api}
      - CMS_VENDOR_URL=${CMS_VENDOR_URL:-http://vendor-management:8000/api}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      - CMS_SERVICE_TIMEOUT=${CMS_SERVICE_TIMEOUT:-5}
      - TS_API_URL=${TS_API_URL:-}
      - TS_REIMBURSEMENT_STATUS_URL=${TS_REIMBURSEMENT_STATUS_URL:-}
      - TS_INTERNAL_SECRET=${TS_INTERNAL_SECRET:-}
      - TS_SERVICE_TIMEOUT=${TS_SERVICE_TIMEOUT:-10}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5002}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5002}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_SCHEME=${MAIL_SCHEME:-}
      - MAIL_HOST=${MAIL_HOST:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-no-reply@sbsi.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-SBSI SERMS}
    command: php artisan queue:work --sleep=1 --tries=3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: serms_web
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - serms_network
      - shared-capstone-network
    command: npm run dev -- --host --port 5002

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: serms_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_ARBITRARY=${PMA_ARBITRARY:-1}
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=${PMA_PASSWORD:-secret}
    depends_on:
      - mysql
    networks:
      - serms_network

networks:
  serms_network:
    driver: bridge
  shared-capstone-network:
    external: true

volumes:
  serms_mysql_data:
  serms_api_vendor:
  serms_api_bootstrap_cache:
