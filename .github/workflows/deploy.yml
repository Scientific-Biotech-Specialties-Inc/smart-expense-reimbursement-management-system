name: deploy-serms

# Builds the SERMS images (api + static web) and rolls them in Azure Container Apps.
# Requires the infra repo to have been deployed first (environment + container apps).
# The web build injects VITE_AUTH_MODULE_URL = the live auth-proxy FQDN.
#
# Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC).

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  RG: rg-capstone
  REGISTRY_ORG: ghcr.io/scientific-biotech-specialties-inc
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: { group: azure-serms, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve auth-proxy FQDN
        id: proxy
        run: |
          FQDN=$(az containerapp show -n auth-proxy -g "${{ env.RG }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "AUTH_MODULE_URL=https://$FQDN" >> "$GITHUB_ENV"

      - name: Build and push serms-api
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_ORG }}/serms-api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY_ORG }}/serms-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push serms-web (static, production bundle)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile.prod
          build-args: |
            VITE_AUTH_MODULE_URL=${{ env.AUTH_MODULE_URL }}
            VITE_API_BASE_URL=
          push: true
          tags: |
            ${{ env.REGISTRY_ORG }}/serms-web:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY_ORG }}/serms-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll serms-api
        run: az containerapp update -n serms-api -g "${{ env.RG }}" --image ${{ env.REGISTRY_ORG }}/serms-api:${{ env.IMAGE_TAG }}

      - name: Roll serms-worker
        run: az containerapp update -n serms-worker -g "${{ env.RG }}" --image ${{ env.REGISTRY_ORG }}/serms-api:${{ env.IMAGE_TAG }}

      - name: Roll serms-web
        run: az containerapp update -n serms-web -g "${{ env.RG }}" --image ${{ env.REGISTRY_ORG }}/serms-web:${{ env.IMAGE_TAG }}