server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co https://*; connect-src 'self' ws: wss: http: https://*.supabase.co; frame-ancestors 'self';" always;

    # Frontend
    location /serms/ {
        set $upstream_serms_web http://serms_web:5002;
        proxy_pass $upstream_serms_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Gateway
    location /api/serms/ {
        rewrite ^/api/serms/(.*)$ /api/$1 break;
        set $upstream_serms_api http://serms_api:8000;
        proxy_pass $upstream_serms_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
